apiVersion: 1

datasources:
  - name: Prometheus
    uid: prometheus
    type: prometheus
    access: proxy
    url: http://prometheus:9090
    isDefault: true

  - name: Warehouse
    uid: warehouse
    type: grafana-postgresql-datasource
    url: postgres-warehouse:5432
    user: grafana_reader
    jsonData:
      database: ${WAREHOUSE_DB_NAME}
      sslmode: disable
      postgresVersion: 1600
    secureJsonData:
      password: ${GRAFANA_DB_PASSWORD}
