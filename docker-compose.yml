name: stratum

x-airflow-common: &airflow-common
  image: apache/airflow:3.3.2-python3.12
  environment: &airflow-env
    AIRFLOW__CORE__EXECUTOR: LocalExecutor
    AIRFLOW__CORE__AUTH_MANAGER: >-
      airflow.providers.fab.auth_manager.fab_auth_manager.FabAuthManager
    AIRFLOW__DATABASE__SQL_ALCHEMY_CONN: >-
      postgresql+psycopg2://airflow:${AIRFLOW_DB_PASSWORD}@postgres-airflow/airflow
    AIRFLOW__CORE__FERNET_KEY: ${AIRFLOW_FERNET_KEY}
    AIRFLOW__CORE__EXECUTION_API_SERVER_URL: http://airflow-apiserver:8080/execution/
    AIRFLOW__API_AUTH__JWT_SECRET: ${AIRFLOW_JWT_SECRET}
    AIRFLOW__API_AUTH__JWT_ISSUER: stratum
    AIRFLOW__API__SECRET_KEY: ${AIRFLOW_API_SECRET_KEY}
    AIRFLOW__CORE__DAGS_ARE_PAUSED_AT_CREATION: "true"
    AIRFLOW__CORE__LOAD_EXAMPLES: "false"
    AIRFLOW__SCHEDULER__ENABLE_HEALTH_CHECK: "true"
    AIRFLOW__METRICS__STATSD_ON: "true"
    AIRFLOW__METRICS__STATSD_HOST: statsd-exporter
    AIRFLOW__METRICS__STATSD_PORT: "9125"
    AIRFLOW__METRICS__STATSD_PREFIX: airflow
    PYTHONPATH: /opt/stratum/src
    STRATUM_CONFIG_DIR: /opt/stratum/config
    STRATUM_HOST_DIR: ${PWD}
    STRATUM_SPARK_IMAGE: stratum/spark-jobs:latest
    STRATUM_DBT_IMAGE: stratum/dbt:latest
    STRATUM_DOCKER_NETWORK: stratum_default
    OLTP_DB_HOST: postgres-oltp
    OLTP_DB_PORT: "5432"
    OLTP_DB_NAME: ${OLTP_DB_NAME}
    OLTP_DB_USER: ${OLTP_DB_USER}
    OLTP_DB_PASSWORD: ${OLTP_DB_PASSWORD}
    LAKE_BUCKET: ${LAKE_BUCKET}
    S3_ENDPOINT_URL: http://rustfs:9000
    AWS_ACCESS_KEY_ID: ${LAKE_ACCESS_KEY}
    AWS_SECRET_ACCESS_KEY: ${LAKE_SECRET_KEY}
    KAFKA_BOOTSTRAP_SERVERS: kafka:9092
    SPARK_DRIVER_MEMORY: 1g
    WAREHOUSE_DB_HOST: postgres-warehouse
    WAREHOUSE_DB_PORT: "5432"
    WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME}
    WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER}
    WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
  volumes:
    - ./airflow/dags:/opt/airflow/dags:ro
    - ./src:/opt/stratum/src:ro
    - ./config:/opt/stratum/config:ro
    - airflow-logs:/opt/airflow/logs
    - /var/run/docker.sock:/var/run/docker.sock
  user: "${AIRFLOW_UID:-50000}:0"
  depends_on: &airflow-depends-on
    postgres-airflow:
      condition: service_healthy

services:
  postgres-oltp:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ${OLTP_DB_NAME}
      POSTGRES_USER: ${OLTP_DB_USER}
      POSTGRES_PASSWORD: ${OLTP_DB_PASSWORD}
    volumes:
      - ./docker/postgres-oltp/init:/docker-entrypoint-initdb.d:ro
      - oltp-data:/var/lib/postgresql/data
    ports:
      - "${OLTP_DB_HOST_PORT:-5433}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${OLTP_DB_USER} -d ${OLTP_DB_NAME}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  kafka:
    image: apache/kafka:4.3.2
    environment:
      KAFKA_NODE_ID: 1
      KAFKA_PROCESS_ROLES: broker,controller
      KAFKA_CONTROLLER_QUORUM_VOTERS: 1@kafka:9093
      KAFKA_CONTROLLER_LISTENER_NAMES: CONTROLLER
      KAFKA_LISTENERS: >-
        INTERNAL://:9092,CONTROLLER://:9093,EXTERNAL://:29092
      KAFKA_ADVERTISED_LISTENERS: >-
        INTERNAL://kafka:9092,EXTERNAL://localhost:${KAFKA_HOST_PORT:-29092}
      KAFKA_LISTENER_SECURITY_PROTOCOL_MAP: >-
        CONTROLLER:PLAINTEXT,INTERNAL:PLAINTEXT,EXTERNAL:PLAINTEXT
      KAFKA_INTER_BROKER_LISTENER_NAME: INTERNAL
      KAFKA_OFFSETS_TOPIC_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_REPLICATION_FACTOR: 1
      KAFKA_TRANSACTION_STATE_LOG_MIN_ISR: 1
      KAFKA_GROUP_INITIAL_REBALANCE_DELAY_MS: 0
      KAFKA_AUTO_CREATE_TOPICS_ENABLE: "false"
    ports:
      - "${KAFKA_HOST_PORT:-29092}:29092"
    healthcheck:
      test:
        - CMD-SHELL
        - >-
          /opt/kafka/bin/kafka-topics.sh
          --bootstrap-server localhost:9092 --list
      interval: 10s
      retries: 20
    restart: unless-stopped

  kafka-init:
    image: apache/kafka:4.3.2
    depends_on:
      kafka:
        condition: service_healthy
    entrypoint: ["/bin/bash", "-c"]
    command:
      - >-
        /opt/kafka/bin/kafka-topics.sh --bootstrap-server kafka:9092
        --create --if-not-exists --topic shop.clickstream.v1
        --partitions 3 --replication-factor 1
        --config retention.ms=604800000
    restart: "no"

  kafka-ui:
    image: ghcr.io/kafbat/kafka-ui:v1.4.2
    environment:
      KAFKA_CLUSTERS_0_NAME: stratum
      KAFKA_CLUSTERS_0_BOOTSTRAPSERVERS: kafka:9092
    ports:
      - "${KAFKA_UI_HOST_PORT:-8081}:8080"
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  generator:
    build:
      context: .
      dockerfile: docker/generator/Dockerfile
    environment:
      OLTP_DB_HOST: postgres-oltp
      OLTP_DB_PORT: "5432"
      OLTP_DB_NAME: ${OLTP_DB_NAME}
      OLTP_DB_USER: ${OLTP_DB_USER}
      OLTP_DB_PASSWORD: ${OLTP_DB_PASSWORD}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      CLICKSTREAM_TOPIC: shop.clickstream.v1
      TICK_SECONDS: ${GENERATOR_TICK_SECONDS:-2}
      MAX_VISITS_PER_TICK: ${GENERATOR_MAX_VISITS_PER_TICK:-5}
      CORRUPTION_RATE: ${GENERATOR_CORRUPTION_RATE:-0.03}
    depends_on:
      postgres-oltp:
        condition: service_healthy
      kafka-init:
        condition: service_completed_successfully
    restart: unless-stopped

  rustfs:
    image: rustfs/rustfs:1.0.4
    environment:
      RUSTFS_VOLUMES: /data
      RUSTFS_ADDRESS: 0.0.0.0:9000
      RUSTFS_CONSOLE_ADDRESS: 0.0.0.0:9001
      RUSTFS_CONSOLE_ENABLE: "true"
      RUSTFS_ACCESS_KEY: ${LAKE_ACCESS_KEY}
      RUSTFS_SECRET_KEY: ${LAKE_SECRET_KEY}
    volumes:
      - lake-data:/data
    ports:
      - "${LAKE_API_HOST_PORT:-9000}:9000"
      - "${LAKE_CONSOLE_HOST_PORT:-9001}:9001"
    healthcheck:
      test: ["CMD", "curl", "-fsS", "http://127.0.0.1:9000/health"]
      interval: 10s
      retries: 20
    restart: unless-stopped

  lake-init:
    image: amazon/aws-cli:2.39.0
    environment:
      AWS_ACCESS_KEY_ID: ${LAKE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${LAKE_SECRET_KEY}
      AWS_REGION: us-east-1
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        aws --endpoint-url http://rustfs:9000 s3api head-bucket
        --bucket ${LAKE_BUCKET} 2>/dev/null
        || aws --endpoint-url http://rustfs:9000 s3 mb s3://${LAKE_BUCKET}
    depends_on:
      rustfs:
        condition: service_healthy
    restart: "no"

  spark-jobs:
    build:
      context: .
      dockerfile: docker/spark/Dockerfile
    image: stratum/spark-jobs:latest
    profiles: ["jobs"]
    environment:
      OLTP_DB_HOST: postgres-oltp
      OLTP_DB_PORT: "5432"
      OLTP_DB_NAME: ${OLTP_DB_NAME}
      OLTP_DB_USER: ${OLTP_DB_USER}
      OLTP_DB_PASSWORD: ${OLTP_DB_PASSWORD}
      LAKE_BUCKET: ${LAKE_BUCKET}
      S3_ENDPOINT_URL: http://rustfs:9000
      AWS_ACCESS_KEY_ID: ${LAKE_ACCESS_KEY}
      AWS_SECRET_ACCESS_KEY: ${LAKE_SECRET_KEY}
      KAFKA_BOOTSTRAP_SERVERS: kafka:9092
      SPARK_DRIVER_MEMORY: 1g
      WAREHOUSE_DB_HOST: postgres-warehouse
      WAREHOUSE_DB_PORT: "5432"
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME}
      WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER}
      WAREHOUSE_DB_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
    volumes:
      - ./config:/app/config:ro
    depends_on:
      postgres-oltp:
        condition: service_healthy
      lake-init:
        condition: service_completed_successfully
      kafka-init:
        condition: service_completed_successfully
      postgres-warehouse:
        condition: service_healthy

  postgres-warehouse:
    image: postgres:16.4
    environment:
      POSTGRES_DB: ${WAREHOUSE_DB_NAME}
      POSTGRES_USER: ${WAREHOUSE_DB_USER}
      POSTGRES_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
    volumes:
      - ./docker/postgres-warehouse/init:/docker-entrypoint-initdb.d:ro
      - warehouse-data:/var/lib/postgresql/data
    ports:
      - "${WAREHOUSE_DB_HOST_PORT:-5434}:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U ${WAREHOUSE_DB_USER} -d ${WAREHOUSE_DB_NAME}"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  dbt:
    build:
      context: .
      dockerfile: docker/dbt/Dockerfile
    image: stratum/dbt:latest
    profiles: ["jobs"]
    environment:
      WAREHOUSE_DB_HOST: postgres-warehouse
      WAREHOUSE_DB_PORT: "5432"
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME}
      WAREHOUSE_DB_USER: ${WAREHOUSE_DB_USER}
      DBT_ENV_SECRET_WAREHOUSE_PASSWORD: ${WAREHOUSE_DB_PASSWORD}
    depends_on:
      postgres-warehouse:
        condition: service_healthy

  postgres-airflow:
    image: postgres:16.4
    environment:
      POSTGRES_DB: airflow
      POSTGRES_USER: airflow
      POSTGRES_PASSWORD: ${AIRFLOW_DB_PASSWORD}
    volumes:
      - airflow-db-data:/var/lib/postgresql/data
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U airflow -d airflow"]
      interval: 5s
      retries: 20
    restart: unless-stopped

  airflow-init:
    <<: *airflow-common
    environment:
      <<: *airflow-env
      _AIRFLOW_DB_MIGRATE: "true"
      _AIRFLOW_WWW_USER_CREATE: "true"
      _AIRFLOW_WWW_USER_USERNAME: ${AIRFLOW_ADMIN_USER}
      _AIRFLOW_WWW_USER_PASSWORD: ${AIRFLOW_ADMIN_PASSWORD}
    command:
      - bash
      - -c
      - airflow pools set spark 2 "Concurrent Spark job containers"
    restart: "no"

  airflow-apiserver:
    <<: *airflow-common
    command: api-server
    ports:
      - "${AIRFLOW_HOST_PORT:-8080}:8080"
    healthcheck:
      test: ["CMD", "curl", "--fail", "http://localhost:8080/api/v2/monitor/health"]
      interval: 30s
      retries: 5
      start_period: 30s
    depends_on: &after-init
      <<: *airflow-depends-on
      airflow-init:
        condition: service_completed_successfully
    restart: unless-stopped

  airflow-scheduler:
    <<: *airflow-common
    command: scheduler
    healthcheck:
      test:
        - CMD-SHELL
        - airflow jobs check --job-type SchedulerJob --hostname "$${HOSTNAME}"
      interval: 30s
      retries: 5
      start_period: 30s
    depends_on: *after-init
    restart: unless-stopped

  airflow-dag-processor:
    <<: *airflow-common
    command: dag-processor
    healthcheck:
      test:
        - CMD-SHELL
        - airflow jobs check --job-type DagProcessorJob --hostname "$${HOSTNAME}"
      interval: 30s
      retries: 5
      start_period: 30s
    depends_on: *after-init
    restart: unless-stopped

  airflow-triggerer:
    <<: *airflow-common
    command: triggerer
    depends_on: *after-init
    restart: unless-stopped

  warehouse-init:
    image: postgres:16.4
    environment:
      PGHOST: postgres-warehouse
      PGDATABASE: ${WAREHOUSE_DB_NAME}
      PGUSER: ${WAREHOUSE_DB_USER}
      PGPASSWORD: ${WAREHOUSE_DB_PASSWORD}
      GRAFANA_PASSWORD: ${GRAFANA_DB_PASSWORD}
      POWERBI_PASSWORD: ${POWERBI_DB_PASSWORD}
    volumes:
      - ./docker/postgres-warehouse/readonly_role.sql:/readonly_role.sql:ro
    entrypoint: ["/bin/sh", "-c"]
    command:
      - >-
        psql -v ON_ERROR_STOP=1 -v dbname="$$PGDATABASE"
        -v grafana_password="$$GRAFANA_PASSWORD" -v powerbi_password="$$POWERBI_PASSWORD"
        -f /readonly_role.sql
    depends_on:
      postgres-warehouse:
        condition: service_healthy
    restart: "no"

  statsd-exporter:
    image: prom/statsd-exporter:v0.31.0
    command: ["--statsd.mapping-config=/etc/statsd/mapping.yml"]
    volumes:
      - ./docker/monitoring/statsd-mapping.yml:/etc/statsd/mapping.yml:ro
    restart: unless-stopped

  kafka-exporter:
    image: danielqsj/kafka-exporter:v1.11.0
    command: ["--kafka.server=kafka:9092"]
    depends_on:
      kafka:
        condition: service_healthy
    restart: unless-stopped

  postgres-exporter:
    image: prometheuscommunity/postgres-exporter:v0.20.1
    environment:
      DATA_SOURCE_URI: postgres-oltp:5432/${OLTP_DB_NAME}?sslmode=disable
      DATA_SOURCE_USER: ${OLTP_DB_USER}
      DATA_SOURCE_PASS: ${OLTP_DB_PASSWORD}
    depends_on:
      postgres-oltp:
        condition: service_healthy
    restart: unless-stopped

  prometheus:
    image: prom/prometheus:v3.15.1
    volumes:
      - ./docker/monitoring/prometheus.yml:/etc/prometheus/prometheus.yml:ro
      - prometheus-data:/prometheus
    ports:
      - "${PROMETHEUS_HOST_PORT:-9090}:9090"
    restart: unless-stopped

  grafana:
    image: grafana/grafana:13.2.5
    environment:
      GF_SECURITY_ADMIN_PASSWORD: ${GRAFANA_ADMIN_PASSWORD}
      GF_USERS_ALLOW_SIGN_UP: "false"
      GF_DASHBOARDS_DEFAULT_HOME_DASHBOARD_PATH: /var/lib/grafana/dashboards/stratum-platform.json
      WAREHOUSE_DB_NAME: ${WAREHOUSE_DB_NAME}
      GRAFANA_DB_PASSWORD: ${GRAFANA_DB_PASSWORD}
    volumes:
      - ./docker/monitoring/grafana/provisioning:/etc/grafana/provisioning:ro
      - ./docker/monitoring/grafana/dashboards:/var/lib/grafana/dashboards:ro
      - grafana-data:/var/lib/grafana
    ports:
      - "${GRAFANA_HOST_PORT:-3000}:3000"
    depends_on:
      prometheus:
        condition: service_started
      warehouse-init:
        condition: service_completed_successfully
    restart: unless-stopped

volumes:
  oltp-data:
  lake-data:
  warehouse-data:
  airflow-db-data:
  airflow-logs:
  prometheus-data:
  grafana-data:
