stratum:
  target: local
  outputs:
    local:
      type: postgres
      host: "{{ env_var('WAREHOUSE_DB_HOST', 'localhost') }}"
      port: "{{ env_var('WAREHOUSE_DB_PORT', '5434') | as_number }}"
      dbname: "{{ env_var('WAREHOUSE_DB_NAME', 'warehouse') }}"
      user: "{{ env_var('WAREHOUSE_DB_USER', 'warehouse') }}"
      password: "{{ env_var('DBT_ENV_SECRET_WAREHOUSE_PASSWORD') }}"
      schema: public
      threads: 4
