models:
  - name: dim_customers
    description: One row per customer, with lifetime value and lifecycle stage. E-mail is hashed.
    columns:
      - name: customer_id
        data_tests: [unique, not_null]
      - name: lifecycle_stage
        data_tests:
          - accepted_values:
              arguments:
                values: ["prospect", "new", "returning"]

  - name: dim_products
    description: One row per product (current attributes).
    columns:
      - name: product_id
        data_tests: [unique, not_null]

  - name: dim_date
    description: Calendar, one row per day from 2025-01-01 to 2027-12-31.
    columns:
      - name: date_day
        data_tests: [unique, not_null]

  - name: fct_orders
    description: One row per order (current status).
    columns:
      - name: order_id
        data_tests: [unique, not_null]
      - name: customer_id
        data_tests:
          - not_null
          - relationships:
              arguments:
                to: ref('dim_customers')
                field: customer_id
              config:
                where: "ordered_at < current_timestamp - interval '2 hours'"
      - name: order_date
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_date')
                field: date_day
      - name: net_amount
        data_tests:
          - dbt_utils.accepted_range:
              arguments:
                min_value: 0

  - name: fct_order_items
    description: One row per order line.
    columns:
      - name: order_item_id
        data_tests: [unique, not_null]
      - name: order_id
        data_tests:
          - relationships:
              arguments:
                to: ref('fct_orders')
                field: order_id
              config:
                where: "item_updated_at < current_timestamp - interval '2 hours'"
      - name: product_id
        data_tests:
          - relationships:
              arguments:
                to: ref('dim_products')
                field: product_id
