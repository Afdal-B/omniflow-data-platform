models:
  - name: stg_ops__pipeline_runs
    description: Pipeline runs, renamed.
    columns:
      - name: run_status
        data_tests:
          - accepted_values:
              arguments:
                values: ["success", "failed"]
    data_tests:
      - dbt_utils.unique_combination_of_columns:
          arguments:
            combination_of_columns: ["pipeline_name", "batch_id"]
