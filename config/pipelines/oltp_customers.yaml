name: oltp_customers
description: Customer reference data from the shop OLTP database.

orchestration:
  schedule: "@hourly"
  retries: 2
  tags: [batch, oltp]

source:
  type: jdbc
  connection: OLTP_DB
  table: shop.customers
  mode: incremental
  watermark_column: updated_at
  lookback_minutes: 10

quality:
  - {check: not_null, column: customer_id}
  - {check: not_null, column: email}
  - {check: regex, column: email, pattern: '^[^@\s]+@[^@\s]+\.[A-Za-z]{2,}$'}
  - {check: regex, column: country_code, pattern: '^[A-Z]{2}$'}
  - {check: accepted_values, column: segment, values: [consumer, business]}

target:
  source: oltp
  dataset: customers
